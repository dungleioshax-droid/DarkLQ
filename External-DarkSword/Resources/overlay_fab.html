<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <style>
      :root { color-scheme: dark; }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
      }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }
      body { display: grid; place-items: center; }
      button {
        position: relative;
        width: 46px;
        height: 46px;
        padding: 0;
        display: grid;
        place-items: center;
        border: 1px solid rgba(92, 232, 255, 0.82);
        border-radius: 15px;
        background: linear-gradient(145deg, rgba(24, 22, 48, 0.98), rgba(8, 13, 28, 0.98));
        color: #5ce8ff;
        touch-action: manipulation;
        box-shadow: 0 5px 18px rgba(0, 0, 0, 0.5), 0 0 17px rgba(92, 232, 255, 0.18), inset 0 0 12px rgba(167, 139, 250, 0.1);
        cursor: pointer;
        transition: transform 0.14s ease, border-color 0.14s ease, box-shadow 0.14s ease;
      }
      button::before {
        content: "";
        position: absolute;
        inset: 4px;
        border: 1px solid rgba(167, 139, 250, 0.25);
        border-radius: 10px;
        pointer-events: none;
      }
      button:active { transform: scale(0.92); border-color: #c7f8ff; box-shadow: 0 0 20px rgba(92, 232, 255, 0.45); }
      svg { display: block; pointer-events: none; }
    </style>
  </head>
  <body>
    <button id="fab" aria-label="Open menu">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13.2 2 5.5 13h5l-.7 9L18.5 11h-5.2l-.1-9Z" />
      </svg>
    </button>
    <script>
      var socketURL = "ws://127.0.0.1:%%OVERLAY_WS_PORT%%";
      var socket = null;
      var reconnectTimer = 0;
      var pendingToggle = false;
      var fab = document.getElementById("fab");

      function send(message) {
        if (!socket || socket.readyState !== WebSocket.OPEN) return false;
        try {
          socket.send(JSON.stringify(message));
          return true;
        } catch (error) {
          return false;
        }
      }

      function flushPendingToggle() {
        if (!pendingToggle) return;
        if (send({ type: "toggleMenu" })) pendingToggle = false;
      }

      function connect() {
        try {
          socket = new WebSocket(socketURL);
        } catch (error) {
          scheduleReconnect();
          return;
        }
        socket.onopen = function () {
          send({ type: "hello", role: "fab" });
          flushPendingToggle();
        };
        socket.onclose = function () {
          socket = null;
          scheduleReconnect();
        };
        socket.onerror = function () {
          try {
            socket.close();
          } catch (error) {}
        };
      }

      function scheduleReconnect() {
        if (reconnectTimer) return;
        reconnectTimer = setTimeout(function () {
          reconnectTimer = 0;
          connect();
        }, 500);
      }

      fab.addEventListener("click", function (event) {
        event.preventDefault();
        pendingToggle = true;
        flushPendingToggle();
      });

      connect();
    </script>
  </body>
</html>
